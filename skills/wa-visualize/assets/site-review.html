<!DOCTYPE html>
<!-- Generated by wa-visualize `site` (scripts/render_site.py). Do not edit by hand: change the map, updates.json or questions.json and re-render. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>{{TITLE}} review · Benali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ASSETS}}/benali-review-theme.css">
</head>
<body class="bz-memo{{SINGLE}}">
<div class="bz-memo-page">

  <header class="bz-memo-head">
    <div class="bz-lockup"><span class="wordmark" role="img" aria-label="Benali"></span></div>
    <h1 class="bz-h-doc">{{TITLE}}</h1>
    <div class="bz-memo-meta">
      <span><b>Prepared by</b> Benali</span>
      <span><a class="back" href="{{HOME}}">All workflows</a></span>
    </div>
  </header>

  <div class="bar">
    <div class="legend" aria-label="Status"><span class="lg-active">Active</span><span class="lg-draft">Draft</span><span class="lg-gap">Gap</span></div>
    <div class="tools">
      <label for="who">Your name</label>
      <input id="who" type="text" autocomplete="name" placeholder="Name">
      <span class="progress" id="progress">0 of {{TOTAL}} answered</span>
      <button type="button" class="btn" id="copy">Copy responses</button>
      <span class="copied" id="copied" hidden>Copied. Paste it into an email to Benali.</span>
    </div>
  </div>
  <textarea class="fallback" id="fallback" rows="8" hidden aria-label="Your responses, ready to copy"></textarea>

  <nav class="tabs" aria-label="Workflows">{{TABS}}<label class="toggle" for="only"><input type="checkbox" id="only"> Show questions only</label></nav>

  {{SECTIONS}}

</div>
<script>
(function () {
  var KEY = '{{STORE}}';
  var tabs = [].slice.call(document.querySelectorAll('.tab'));
  var maps = [].slice.call(document.querySelectorAll('.map'));
  var boxes = [].slice.call(document.querySelectorAll('.qa'));
  var who = document.getElementById('who');

  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} }

  // margin notes: each card level with its row, pushed down only to clear the card above
  function place() {
    var narrow = window.matchMedia('(max-width: 920px)').matches;
    maps.forEach(function (m) {
      if (m.hidden) return;
      var col = m.querySelector('.qcol'), base = col.getBoundingClientRect().top, prev = 0;
      [].slice.call(col.children).forEach(function (c) {
        if (narrow) { c.style.top = ''; return; }
        var r = document.getElementById(c.dataset.row);
        var visible = r && r.offsetParent !== null;
        c.style.display = visible || !document.body.classList.contains('only') ? '' : 'none';
        var top = visible ? r.getBoundingClientRect().top - base : prev;
        top = Math.max(top, prev);
        c.style.top = top + 'px';
        prev = top + c.offsetHeight + 10;
      });
      col.style.height = narrow ? '' : prev + 'px';
    });
  }

  function show(k) {
    tabs.forEach(function (t) { t.setAttribute('aria-current', t.dataset.k === k ? 'true' : 'false'); });
    maps.forEach(function (m) { m.hidden = m.dataset.k !== k; });
    place();
  }

  function refresh() {
    var answered = 0;
    boxes.forEach(function (b) {
      var card = b.closest('.qc'), done = b.value.trim() !== '';
      card.classList.toggle('answered', done);
      if (done) answered++;
    });
    document.getElementById('progress').textContent = answered + ' of ' + boxes.length + ' answered';
    maps.forEach(function (m) {
      var k = m.dataset.k, open = 0;
      m.querySelectorAll('.qa').forEach(function (b) { if (!b.value.trim()) open++; });
      var c = document.querySelector('[data-cnt="' + k + '"]');
      c.textContent = open; c.classList.toggle('done', open === 0);
    });
    document.querySelectorAll('.qm').forEach(function (mk) {
      var row = mk.closest('.row, .ph'), cards = document.querySelectorAll('.qc[data-row="' + row.id + '"]'), left = 0;
      cards.forEach(function (c) { if (!c.classList.contains('answered')) left++; });
      mk.textContent = left || '✓'; mk.classList.toggle('done', left === 0);
    });
  }

  function flash(el) { if (!el) return; el.classList.add('hl'); setTimeout(function () { el.classList.remove('hl'); }, 1600); }

  function format() {
    var name = who.value.trim(), lines = ['{{TITLE}}: responses'];
    if (name) lines.push('From: ' + name);
    lines.push(document.getElementById('progress').textContent, '');
    var current = null;
    document.querySelectorAll('.qc').forEach(function (c) {
      var a = c.querySelector('.qa').value.trim();
      if (!a) return;
      if (c.dataset.map !== current) { current = c.dataset.map; lines.push(current, ''); }
      lines.push(c.dataset.at, 'Question: ' + c.dataset.q, 'Response: ' + a, '');
    });
    return lines.join('\n').trim() + '\n';
  }

  // restore
  var saved = load();
  who.value = saved._who || '';
  boxes.forEach(function (b) { b.value = saved[b.id] || ''; });

  boxes.forEach(function (b) {
    b.addEventListener('input', function () { var d = load(); d[b.id] = b.value; save(d); refresh(); place(); });
  });
  who.addEventListener('input', function () { var d = load(); d._who = who.value; save(d); });

  document.getElementById('copy').addEventListener('click', function () {
    var text = format(), ok = document.getElementById('copied'), fb = document.getElementById('fallback');
    function fallback() { fb.hidden = false; fb.value = text; fb.focus(); fb.select(); ok.hidden = false; ok.textContent = 'Select all and copy the text below.'; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { fb.hidden = true; ok.hidden = false; ok.textContent = 'Copied. Paste it into an email to Benali.'; }, fallback);
    } else { fallback(); }
  });

  tabs.forEach(function (t) { t.addEventListener('click', function (e) { e.preventDefault(); show(t.dataset.k); history.replaceState(null, '', '#' + t.dataset.k); }); });
  document.addEventListener('click', function (e) {
    var j = e.target.closest('.qc-jump'), m = e.target.closest('.qm');
    if (j) { var r = document.getElementById(j.dataset.row); if (r) { r.scrollIntoView({ behavior: 'smooth', block: 'center' }); flash(r); } }
    if (m) { e.preventDefault(); e.stopPropagation(); var q = document.getElementById(m.dataset.card); if (q) { q.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); flash(q); var ta = q.querySelector('.qa'); if (ta) ta.focus({ preventScroll: true }); } }
  }, true);
  document.querySelectorAll('details.row').forEach(function (d) { d.addEventListener('toggle', place); });
  var cb = document.getElementById('only');
  cb.addEventListener('change', function () { document.body.classList.toggle('only', cb.checked); place(); });
  window.addEventListener('resize', place);
  if (document.fonts) document.fonts.ready.then(place);

  var h = location.hash.slice(1);
  refresh();
  show(maps.some(function (m) { return m.dataset.k === h; }) ? h : maps[0].dataset.k);
})();
</script>
</body>
</html>
